<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — Himawari Clan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="admin">

<nav class="site-nav">
  <a href="index.html" class="brand"><span class="emblem"></span> Himawari</a>
  <div class="nav-links">
    <a href="index.html" data-page="home">Home</a>
    <a href="roster.html" data-page="roster">Roster</a>
    <a href="gallery.html" data-page="gallery">Gallery</a>
    <a href="join.html" data-page="join">Join</a>
    <a href="admin.html" data-page="admin">Admin</a>
  </div>
  <button class="nav-toggle" aria-label="Toggle menu">☰</button>
</nav>

<!-- Login Gate -->
<div class="login-gate" id="login-gate" style="max-width: 420px; margin: 100px auto; padding: 40px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 8px 32px rgba(0,0,0,0.4);">
  <div style="text-align: center; margin-bottom: 24px;">
    <span class="emblem" style="margin: 0 auto 12px; display: block;"></span>
    <h2 style="font-family: var(--font-display); font-size: 1.8rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text);">Admin Access</h2>
    <p style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-dim); margin-top: 4px;">Enter your credentials to control the clan portal</p>
  </div>
  
  <form id="login-form">
    <div style="margin-bottom: 16px;">
      <label style="display: block; font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gold); margin-bottom: 6px;">Username</label>
      <input type="text" id="admin-user" style="width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 2px; color: var(--text); font-family: var(--font-mono); font-size: 0.9rem;" required>
    </div>
    <div style="margin-bottom: 24px;">
      <label style="display: block; font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gold); margin-bottom: 6px;">Password</label>
      <input type="password" id="admin-pass" style="width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 2px; color: var(--text); font-family: var(--font-mono); font-size: 0.9rem;" required>
    </div>
    <button type="submit" id="login-btn" class="btn btn-gold" style="width: 100%; padding: 12px; font-size: 0.9rem; font-weight: 700; letter-spacing: 0.08em;">AUTHENTICATE</button>
    <p id="login-error" style="color: var(--ember); font-family: var(--font-mono); font-size: 0.8rem; text-align: center; margin-top: 16px; min-height: 1em;"></p>
  </form>
</div>

<!-- Admin Dashboard -->
<div id="admin-app" style="display:none;" class="container style-padding">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
    <h1>Admin Control Room</h1>
    <button id="logout-btn" class="btn btn-ghost">Logout</button>
  </div>

  <div class="admin-tabs" style="display:flex;gap:8px;margin-bottom:24px;border-bottom:1px solid var(--line);padding-bottom:8px;">
    <button class="admin-tab active" data-tab="announcements">Announcements</button>
    <button class="admin-tab" data-tab="roster">Roster</button>
    <button class="admin-tab" data-tab="applicants">Applicants <span id="applicant-count-badge"></span></button>
    <button class="admin-tab" data-tab="tournaments">Tournaments</button>
    <button class="admin-tab" data-tab="brackets">Bracket Gen</button>
  </div>

  <!-- Announcements Panel -->
  <div class="admin-panel active" id="panel-announcements">
    <form id="announce-form" class="card" style="padding:20px;margin-bottom:24px;">
      <h3>Create / Edit Announcement</h3>
      <input type="hidden" id="announce-id">
      <div style="margin-bottom:12px;">
        <label>Title</label>
        <input type="text" id="announce-title" required style="width:100%;padding:8px;background:var(--bg);border:1px solid var(--line);color:var(--text);">
      </div>
      <div style="margin-bottom:12px;">
        <label>Date</label>
        <input type="date" id="announce-date" required style="width:100%;padding:8px;background:var(--bg);border:1px solid var(--line);color:var(--text);">
      </div>
      <div style="margin-bottom:12px;">
        <label>Body</label>
        <textarea id="announce-body" rows="4" required style="width:100%;padding:8px;background:var(--bg);border:1px solid var(--line);color:var(--text);"></textarea>
      </div>
      <div style="display:flex;gap:8px;">
        <button type="submit" class="btn btn-gold">Save Announcement</button>
        <button type="button" id="announce-cancel" class="btn btn-ghost" style="display:none;">Cancel</button>
      </div>
    </form>
    <div id="announce-list"></div>
  </div>

  <!-- Roster Panel -->
  <div class="admin-panel" id="panel-roster">
    <form id="roster-form" class="card" style="padding:20px;margin-bottom:24px;">
      <h3>Create / Edit Roster Member</h3>
      <input type="hidden" id="roster-id">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
        <div>
          <label>Initials</label>
          <input type="text" id="roster-initials" maxlength="3" style="width:100%;padding:8px;background:var(--bg);border:1px solid var(--line);color:var(--text);">
        </div>
        <div>
          <label>Name</label>
          <input type="text" id="roster-name" required style="width:100%;padding:8px;background:var(--bg);border:1px solid var(--line);color:var(--text);">
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
        <div>
          <label>Tier / Rank</label>
          <select id="roster-tier" style="width:100%;padding:8px;background:var(--bg);border:1px solid var(--line);color:var(--text);">
            <option value="Leadership">Leadership</option>
            <option value="Admin">Admin</option>
            <option value="Officer">Officer</option>
            <option value="Member" selected>Member</option>
          </select>
        </div>
        <div>
          <label>Role</label>
          <input type="text" id="roster-role" required style="width:100%;padding:8px;background:var(--bg);border:1px solid var(--line);color:var(--text);">
        </div>
      </div>
      <div style="margin-bottom:12px;">
        <label>Details / Bio</label>
        <input type="text" id="roster-meta" style="width:100%;padding:8px;background:var(--bg);border:1px solid var(--line);color:var(--text);">
      </div>
      <div style="margin-bottom:12px;">
        <label>Avatar Image Upload</label>
        <input type="file" id="roster-avatar" accept="image/*" style="width:100%;padding:8px;background:var(--bg);border:1px solid var(--line);color:var(--text);">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
        <div>
          <label>K/D Ratio</label>
          <input type="number" step="0.01" id="roster-kd" style="width:100%;padding:8px;background:var(--bg);border:1px solid var(--line);color:var(--text);">
        </div>
        <div>
          <label>Loadout</label>
          <input type="text" id="roster-loadout" style="width:100%;padding:8px;background:var(--bg);border:1px solid var(--line);color:var(--text);">
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px;">
        <div>
          <label>Twitch</label>
          <input type="text" id="roster-twitch" style="width:100%;padding:8px;background:var(--bg);border:1px solid var(--line);color:var(--text);">
        </div>
        <div>
          <label>YouTube</label>
          <input type="text" id="roster-youtube" style="width:100%;padding:8px;background:var(--bg);border:1px solid var(--line);color:var(--text);">
        </div>
        <div>
          <label>X / Twitter</label>
          <input type="text" id="roster-x" style="width:100%;padding:8px;background:var(--bg);border:1px solid var(--line);color:var(--text);">
        </div>
      </div>
      <div style="display:flex;gap:8px;">
        <button type="submit" class="btn btn-gold">Save Member</button>
        <button type="button" id="roster-cancel" class="btn btn-ghost" style="display:none;">Cancel</button>
      </div>
    </form>
    <div id="roster-list"></div>
  </div>

  <!-- Applicants Panel -->
  <div class="admin-panel" id="panel-applicants">
    <div id="applicant-list"></div>
  </div>

  <!-- Tournaments Panel -->
  <div class="admin-panel" id="panel-tournaments">
    <form id="tourney-form" class="card" style="padding:20px;margin-bottom:24px;">
      <h3>Create / Edit Tournament</h3>
      <input type="hidden" id="tourney-id">
      <div style="margin-bottom:12px;">
        <label>Tournament Name</label>
        <input type="text" id="tourney-name" required style="width:100%;padding:8px;background:var(--bg);border:1px solid var(--line);color:var(--text);">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px;">
        <div>
          <label>Date</label>
          <input type="date" id="tourney-date" required style="width:100%;padding:8px;background:var(--bg);border:1px solid var(--line);color:var(--text);">
        </div>
        <div>
          <label>Format</label>
          <input type="text" id="tourney-format" required style="width:100%;padding:8px;background:var(--bg);border:1px solid var(--line);color:var(--text);">
        </div>
        <div>
          <label>Status</label>
          <input type="text" id="tourney-status" required style="width:100%;padding:8px;background:var(--bg);border:1px solid var(--line);color:var(--text);">
        </div>
      </div>
      <div style="display:flex;gap:8px;">
        <button type="submit" class="btn btn-gold">Save Tournament</button>
        <button type="button" id="tourney-cancel" class="btn btn-ghost" style="display:none;">Cancel</button>
      </div>
    </form>
    <div id="tourney-list"></div>
  </div>

  <!-- Brackets Panel -->
  <div class="admin-panel" id="panel-brackets">
    <div class="card" style="padding:20px;">
      <h3>Bracket Generator</h3>
      <div style="margin-bottom:12px;">
        <label>Enter Team Names (One per line)</label>
        <textarea id="bracket-teams" rows="6" style="width:100%;padding:8px;background:var(--bg);border:1px solid var(--line);color:var(--text);"></textarea>
      </div>
      <div style="margin-bottom:12px;">
        <label>Format</label>
        <select id="bracket-format" style="width:100%;padding:8px;background:var(--bg);border:1px solid var(--line);color:var(--text);">
          <option value="auto">Auto-Detect</option>
          <option value="single">Single Elimination</option>
          <option value="round-robin">Round Robin</option>
        </select>
      </div>
      <button id="bracket-generate" class="btn btn-gold">Generate Bracket</button>
      <p id="bracket-note" style="margin-top:12px;color:var(--gold);font-family:var(--font-mono);font-size:0.85rem;"></p>
      <div id="bracket-output" style="margin-top:20px;"></div>
    </div>
  </div>
</div>

<script src="js/main.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
