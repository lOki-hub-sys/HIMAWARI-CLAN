<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roster — Himawari Clan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/enhancements.css">
</head>
<body data-page="roster">

<nav class="site-nav">
  <a href="index.html" class="brand"><span class="emblem"></span> Himawari</a>
  <div class="nav-links">
    <a href="index.html" data-page="home">Home</a>
    <a href="roster.html" data-page="roster">Roster</a>
    <a href="gallery.html" data-page="gallery">Gallery</a>
    <a href="join.html" data-page="join">Join</a>
    <a href="admin.html" data-page="admin">Admin</a>
  </div>
  <button class="nav-toggle" aria-label="Toggle menu">☰</button>
</nav>

<section class="container" style="padding-top: 40px; padding-bottom: 60px;">
  <div class="roster-shell" id="roster-shell">
    <div style="padding:48px;color:var(--text-dim);font-family:var(--font-mono);font-size:0.85rem;" id="roster-loading">
      Loading roster…
    </div>
  </div>
</section>

<footer class="site-footer">
  <span>© 2026 Himawari Clan</span>
  <span>Managed via the clan admin panel</span>
</footer>

<script src="js/main.js"></script>
<script src="js/enhancements.js"></script>
<script>
(async () => {
  const TIER_ORDER = ['Leadership', 'Admin', 'Officer', 'Member'];
  const shell = document.getElementById('roster-shell');

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function getInitials(name) {
    if (!name) return '??';
    const parts = name.trim().split(/[\s_-]+/);
    if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
    return name.slice(0, 2).toUpperCase();
  }

  let roster = [];
  let announcements = [];

  try {
    const [rosterRes, announceRes] = await Promise.all([
      fetch('/api/roster'),
      fetch('/api/announcements').catch(() => null)
    ]);
    if (!rosterRes.ok) throw new Error('Failed to fetch roster');
    roster = await rosterRes.json();
    if (announceRes && announceRes.ok) announcements = await announceRes.json();
  } catch (e) {
    console.error('Roster error:', e);
    shell.innerHTML = '<div style="padding:48px;color:var(--text-dim);font-family:var(--font-mono);font-size:0.85rem;">Could not load the roster right now.</div>';
    return;
  }

  if (!roster || roster.length === 0) {
    shell.innerHTML = '<div style="padding:48px;color:var(--text-dim);font-family:var(--font-mono);font-size:0.85rem;">No roster members found.</div>';
    return;
  }

  // Group members by tier
  const groups = {};
  TIER_ORDER.forEach((t) => (groups[t] = []));
  roster.forEach((m) => {
    const tier = TIER_ORDER.includes(m.tier) ? m.tier : 'Member';
    groups[tier].push(m);
  });

  const activeTiers = TIER_ORDER.filter((t) => groups[t].length > 0);
  const total = roster.length;

  // Sidebar: rank tally items
  const tallyHtml = activeTiers.map((tier) => {
    const count = groups[tier].length;
    const pct = Math.round((count / total) * 100);
    return `
      <div class="rank-tally-item" data-tier="${tier}" role="button" tabindex="0">
        <div class="rank-tally-row">
          <span class="rank-tally-name">${tier}</span>
          <span>${count}</span>
        </div>
        <div class="rank-tally-bar-track"><div class="rank-tally-bar-fill" style="width:${pct}%;"></div></div>
      </div>
    `;
  }).join('');

  // Sidebar: news announcements
  const newsItems = announcements.slice(0, 2);
  const newsHtml = newsItems.length
    ? newsItems.map((a) => `
        <div class="sidebar-news-item">
          <span class="eyebrow">${escapeHtml(a.date || '')}</span>
          <p>${escapeHtml(a.title)}</p>
        </div>
      `).join('')
    : '<p style="font-family:var(--font-mono);font-size:0.72rem;color:var(--text-dim);">No announcements yet.</p>';

  // Tabs: includes 'ALL' tab + individual rank tabs
  const tabsHtml = `
    <button class="roster-tab active" data-tier="ALL">All</button>
    ${activeTiers.map((tier) => `<button class="roster-tab" data-tier="${tier}">${tier}</button>`).join('')}
  `;

  // Build Operator Cards
  let opCounter = 0;
  function cardHtml(m) {
    opCounter += 1;
    const initials = m.initials || getInitials(m.name);
    const avatarHtml = m.avatar_url
      ? `<img src="${escapeHtml(m.avatar_url)}" alt="">`
      : escapeHtml(initials);

    return `
      <div class="operator-card"
        data-id="${escapeHtml(String(m.id))}"
        data-name="${escapeHtml(m.name)}"
        data-tier="${escapeHtml(m.tier || 'Member')}"
        data-role="${escapeHtml(m.role || '')}"
        data-meta="${escapeHtml(m.meta || '')}"
        data-initials="${escapeHtml(initials)}"
        data-avatar="${escapeHtml(m.avatar_url || '')}"
        data-kd="${escapeHtml(m.kd != null ? Number(m.kd).toFixed(2) : '')}"
        data-loadout="${escapeHtml(m.loadout || '')}"
        data-twitch="${escapeHtml(m.twitch || '')}"
        data-youtube="${escapeHtml(m.youtube || '')}"
        data-x="${escapeHtml(m.x_handle || '')}"
        role="button" tabindex="0">
        <div class="op-index">${String(opCounter).padStart(2, '0')}</div>
        <div class="op-avatar">${avatarHtml}</div>
        <div class="op-name">${escapeHtml(m.name)}</div>
        <div class="op-role">${escapeHtml(m.role || m.tier || 'Member')}</div>
        ${m.kd != null ? `<div class="op-kd"><span class="k">K/D</span><span class="v">${escapeHtml(Number(m.kd).toFixed(2))}</span></div>` : ''}
      </div>
    `;
  }

  // Generate section layout
  const sectionsHtml = activeTiers.map((tier) => {
    const cards = groups[tier].map((m) => cardHtml(m)).join('');
    return `
      <div class="roster-section" id="section-${tier}" data-section-tier="${tier}">
        <div class="roster-section-title">${tier}</div>
        <div class="operator-grid">${cards}</div>
      </div>
    `;
  }).join('');

  shell.innerHTML = `
    <aside class="roster-sidebar">
      <div class="roster-sidebar-head"><span class="emblem"></span> Himawari</div>
      <div>
        <div class="sidebar-label">Clan Ranks</div>
        <div class="rank-tally" id="rank-tally">${tallyHtml}</div>
      </div>
      <div class="sidebar-news">
        <div class="sidebar-label">Clan News</div>
        ${newsHtml}
      </div>
    </aside>
    <main class="roster-main">
      <div class="roster-main-head">
        <div>
          <h1>Roster <span class="accent">/ Himawari Clan</span></h1>
          <p class="sub">Displaying ${total} active member${total === 1 ? '' : 's'}</p>
        </div>
        <a href="join.html" class="btn btn-primary roster-apply-btn">Apply to join</a>
      </div>
      <nav class="roster-tabs" id="roster-tabs">${tabsHtml}</nav>
      <div class="operator-detail" id="operator-detail"></div>
      ${sectionsHtml}
    </main>
  `;

  // Render detail view panel
  const detailEl = document.getElementById('operator-detail');

  function renderDetail(card) {
    if (!card) return;
    const avatarHtml = card.dataset.avatar
      ? `<img src="${escapeHtml(card.dataset.avatar)}" alt="">`
      : escapeHtml(card.dataset.initials);

    const links = [];
    if (card.dataset.twitch) links.push(`<a href="https://twitch.tv/${encodeURIComponent(card.dataset.twitch)}" target="_blank" rel="noopener" class="btn btn-ghost" style="padding:6px 12px;font-size:0.72rem;">Twitch</a>`);
    if (card.dataset.youtube) links.push(`<a href="${card.dataset.youtube.startsWith('http') ? card.dataset.youtube : 'https://youtube.com/' + card.dataset.youtube}" target="_blank" rel="noopener" class="btn btn-ghost" style="padding:6px 12px;font-size:0.72rem;">YouTube</a>`);
    if (card.dataset.x) links.push(`<a href="https://x.com/${encodeURIComponent(card.dataset.x)}" target="_blank" rel="noopener" class="btn btn-ghost" style="padding:6px 12px;font-size:0.72rem;">X</a>`);

    detailEl.innerHTML = `
      <div class="op-detail-avatar">${avatarHtml}</div>
      <div>
        <span class="op-detail-tier">${card.dataset.tier || 'Member'}</span>
        <h2>${escapeHtml(card.dataset.name)}</h2>
        <div class="op-detail-role">${escapeHtml(card.dataset.role || '—')}</div>
        <div class="op-detail-fields">
          <div class="op-detail-field"><div class="k">K/D Ratio</div><div class="v">${escapeHtml(card.dataset.kd || '—')}</div></div>
          <div class="op-detail-field"><div class="k">Loadout</div><div class="v">${escapeHtml(card.dataset.loadout || '—')}</div></div>
          <div class="op-detail-field"><div class="k">Details</div><div class="v">${escapeHtml(card.dataset.meta || '—')}</div></div>
        </div>
        ${links.length ? `<div class="op-detail-socials">${links.join('')}</div>` : ''}
      </div>
    `;
  }

  function selectCard(card) {
    document.querySelectorAll('.operator-card').forEach((c) => c.classList.remove('active'));
    card.classList.add('active');
    renderDetail(card);
  }

  document.querySelectorAll('.operator-card').forEach((card) => {
    card.addEventListener('click', () => selectCard(card));
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        selectCard(card);
      }
    });
  });

  // Strict Filter Logic for Tabs & Sidebar
  function filterByTier(tier) {
    // Highlight matching tab
    document.querySelectorAll('.roster-tab').forEach((el) => {
      el.classList.toggle('active', el.dataset.tier === tier);
    });

    // Highlight matching rank tally item in sidebar
    document.querySelectorAll('.rank-tally-item').forEach((el) => {
      el.classList.toggle('active', el.dataset.tier === tier);
    });

    // Show/Hide matching sections
    const sections = document.querySelectorAll('.roster-section');
    sections.forEach((sec) => {
      if (tier === 'ALL' || sec.dataset.sectionTier === tier) {
        sec.style.display = 'block';
      } else {
        sec.style.display = 'none';
      }
    });

    // Select the first visible card in the filtered view
    const visibleCard = document.querySelector('.roster-section[style*="display: block"] .operator-card') || document.querySelector('.operator-card');
    if (visibleCard) {
      selectCard(visibleCard);
    }
  }

  // Attach tab click events
  document.querySelectorAll('.roster-tab').forEach((btn) => {
    btn.addEventListener('click', () => filterByTier(btn.dataset.tier));
  });

  // Attach sidebar rank tally click events
  document.querySelectorAll('.rank-tally-item').forEach((item) => {
    const handleSelect = () => filterByTier(item.dataset.tier);
    item.addEventListener('click', handleSelect);
    item.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        handleSelect();
      }
    });
  });

  // Default selection on load
  const firstCard = document.querySelector('.operator-card');
  if (firstCard) selectCard(firstCard);
})();
</script>
</body>
</html>
