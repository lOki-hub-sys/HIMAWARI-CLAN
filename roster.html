<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roster — Himawari Clan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="roster">

<nav class="site-nav">
  <a href="index.html" class="brand"><span class="emblem"></span> Himawari</a>
  <div class="nav-links">
    <a href="index.html" data-page="home">Home</a>
    <a href="roster.html" data-page="roster">Roster</a>
    <a href="gallery.html" data-page="gallery">Gallery</a>
    <a href="join.html" data-page="join">Join</a>
    <a href="admin.html" data-page="admin">Admin</a>
  </div>
  <button class="nav-toggle" aria-label="Toggle menu">☰</button>
</nav>

<header class="hero" style="padding-bottom:40px;">
  <div class="container">
    <span class="eyebrow">The Roster</span>
    <h1 style="font-size:clamp(2rem,5vw,3.2rem);margin-top:12px;">Six starters, no dead weight</h1>
  </div>
</header>

<section class="container" style="padding-bottom: 60px;">
  <!-- Roster Container -->
  <div id="roster-categories"></div>
</section>

<footer class="site-footer">
  <span>© 2026 Himawari Clan</span>
  <span>Managed via the clan admin panel</span>
</footer>

<script src="js/main.js"></script>
<script>
  (async () => {
    const categoriesContainer = document.getElementById('roster-categories');

    // Helper to generate 2-letter initials from a name, used only as a fallback
    function getInitials(name) {
      if (!name) return '??';
      const parts = name.trim().split(/[\s_-]+/);
      if (parts.length >= 2) {
        return (parts[0][0] + parts[1][0]).toUpperCase();
      }
      return name.slice(0, 2).toUpperCase();
    }

    try {
      // Fetch from API (uses /api/roster endpoint)
      const response = await fetch('/api/roster');
      if (!response.ok) throw new Error('Failed to fetch roster data');

      const roster = await response.json();

      if (!roster || roster.length === 0) {
        categoriesContainer.innerHTML = '<p style="color:var(--text-dim);">No roster members found.</p>';
        return;
      }

      // Render every member as a single grid — roles are free text
      // (e.g. "Substitute", "maingay"), not a fixed hierarchy, so we
      // don't try to bucket members into categories.
      const cardsHtml = roster.map(p => {
        const initials = p.initials || getInitials(p.name);

        return `
          <article class="card player-card reveal" style="position: relative;">
            <div class="player-avatar">${initials}</div>
            <h3>${p.name}</h3>
            <div class="player-role role-tag">${p.role || 'Member'}</div>
            <p class="player-meta">${p.meta || ''}</p>
          </article>
        `;
      }).join('');

      categoriesContainer.innerHTML = `<div class="grid grid-3">${cardsHtml}</div>`;

    } catch (e) {
      console.error('Roster error:', e);
      categoriesContainer.innerHTML = '<p style="color:var(--text-dim);">Could not load the roster right now.</p>';
    }

    if (typeof initReveal === 'function') {
      initReveal();
    }
  })();
</script>
</body>
</html>
