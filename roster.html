<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roster — Himawari Clan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="roster">

<nav class="site-nav">
  <a href="index.html" class="brand"><span class="emblem"></span> Himawari</a>
  <div class="nav-links">
    <a href="index.html" data-page="home">Home</a>
    <a href="roster.html" data-page="roster">Roster</a>
    <a href="gallery.html" data-page="gallery">Gallery</a>
    <a href="join.html" data-page="join">Join</a>
    <a href="admin.html" data-page="admin">Admin</a>
  </div>
  <button class="nav-toggle" aria-label="Toggle menu">☰</button>
</nav>

<header class="hero" style="padding-bottom:40px;">
  <div class="container">
    <span class="eyebrow">The Roster</span>
    <h1 style="font-size:clamp(2rem,5vw,3.2rem);margin-top:12px;">Six starters, no dead weight</h1>
  </div>
</header>

<section class="container" style="padding-bottom: 60px;">
  <!-- Grouped Roster Container -->
  <div id="roster-categories"></div>
</section>

<footer class="site-footer">
  <span>© 2026 Himawari Clan</span>
  <span>Managed via the clan admin panel</span>
</footer>

<script src="js/main.js"></script>
<script>
  (async () => {
    const categoriesContainer = document.getElementById('roster-categories');

    // Helper to generate 2-letter initials from username
    function getInitials(name) {
      if (!name) return '??';
      const parts = name.trim().split(/[\s_-]+/);
      if (parts.length >= 2) {
        return (parts[0][0] + parts[1][0]).toUpperCase();
      }
      return name.slice(0, 2).toUpperCase();
    }

    try {
      // Fetch from API (uses /api/roster endpoint)
      const response = await fetch('/api/roster');
      if (!response.ok) throw new Error('Failed to fetch roster data');
      
      const roster = await response.json();

      if (!roster || roster.length === 0) {
        categoriesContainer.innerHTML = '<p style="color:var(--text-dim);">No roster members found.</p>';
        return;
      }

      // Hierarchy order
      const roleHierarchy = ['Leader', 'Admin', 'Officer', 'Member'];

      // Group members by role
      const grouped = roleHierarchy.reduce((acc, role) => {
        acc[role] = roster.filter(p => (p.role || '').toLowerCase() === role.toLowerCase());
        return acc;
      }, {});

      // Render grouped sections
      const sectionsHtml = roleHierarchy.map(role => {
        const members = grouped[role];
        if (!members || members.length === 0) return ''; // Hide empty categories

        return `
          <div class="roster-category reveal" style="margin-bottom: 40px;">
            <div class="section-head" style="margin-bottom: 20px;">
              <span class="eyebrow">Rank</span>
              <h2 style="font-size: 1.5rem; text-transform: uppercase;">${role}s</h2>
            </div>
            
            <div class="grid grid-3">
              ${members.map(p => {
                const initials = getInitials(p.username);
                const isNew = p.is_new === 1 || p.is_new === true;

                return `
                  <article class="card player-card reveal" style="position: relative;">
                    ${isNew ? '<span class="badge-new" style="position: absolute; top: 12px; right: 12px; background: var(--accent, #e53935); color: #fff; font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 3px; letter-spacing: 1px;">NEW</span>' : ''}
                    
                    <div class="player-avatar">
                      ${p.avatar_url ? `<img src="${p.avatar_url}" alt="${p.username}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` : initials}
                    </div>
                    
                    <h3>${p.username}</h3>
                    <div class="player-role role-tag role-${p.role.toLowerCase()}">${p.role}</div>
                    <p class="player-meta">Joined ${new Date(p.joined_at || Date.now()).toLocaleDateString()}</p>
                  </article>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }).join('');

      categoriesContainer.innerHTML = sectionsHtml || '<p style="color:var(--text-dim);">No roster members found.</p>';

    } catch (e) {
      console.error('Roster error:', e);
      categoriesContainer.innerHTML = '<p style="color:var(--text-dim);">Could not load the roster right now.</p>';
    }

    if (typeof initReveal === 'function') {
      initReveal();
    }
  })();
</script>
</body>
</html>
