<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matches — Himawari Clan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/enhancements.css">
</head>
<body data-page="matches">
<nav class="site-nav">
  <a href="index.html" class="brand"><span class="emblem"></span> Himawari</a>
  <div class="nav-links">
    <a href="index.html" data-page="home">Home</a>
    <a href="roster.html" data-page="roster">Roster</a>
    <a href="matches.html" data-page="matches">Matches</a>
    <a href="gallery.html" data-page="gallery">Gallery</a>
    <a href="join.html" data-page="join">Join</a>
    <a href="admin.html" data-page="admin">Admin</a>
  </div>
  <button class="nav-toggle" aria-label="Toggle menu">☰</button>
</nav>

<header class="hero hero-warroom" style="padding-bottom:40px;">
  <div class="container">
    <div class="hero-grid">
      <div class="hero-copy">
        <span class="eyebrow">War Room</span>
        <h1 style="font-size:clamp(2rem,5vw,3.2rem);margin-top:12px;">Matches</h1>
        <p class="lede" style="margin-top:14px;">Recent results and what's on the calendar next.</p>
      </div>
      <div class="hero-visual warroom-map reveal" data-dir="scale" aria-hidden="true">
        <svg viewBox="0 0 320 260" class="warroom-map-svg">
          <defs>
            <pattern id="warroom-grid" width="20" height="20" patternUnits="userSpaceOnUse">
              <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,176,32,0.12)" stroke-width="1"/>
            </pattern>
          </defs>
          <rect x="10" y="10" width="300" height="240" fill="url(#warroom-grid)" stroke="rgba(255,176,32,0.25)" stroke-width="1"/>
          <path d="M 60 190 L 120 130 L 210 150 L 250 70" fill="none" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="5 5" class="warroom-path"/>
          <g class="warroom-point" transform="translate(60,190)">
            <circle r="16" fill="none" stroke="var(--gold)" stroke-width="1" opacity="0.4"/>
            <circle r="9" fill="var(--panel)" stroke="var(--gold)" stroke-width="1.5"/>
            <text x="0" y="4" text-anchor="middle" class="warroom-label">B</text>
          </g>
          <g class="warroom-point" transform="translate(210,150)">
            <circle r="16" fill="none" stroke="var(--gold)" stroke-width="1" opacity="0.4"/>
            <circle r="9" fill="var(--panel)" stroke="var(--gold)" stroke-width="1.5"/>
            <text x="0" y="4" text-anchor="middle" class="warroom-label">B</text>
          </g>
          <g class="warroom-point" transform="translate(250,70)">
            <circle r="16" fill="none" stroke="var(--ember)" stroke-width="1" opacity="0.4"/>
            <circle r="9" fill="var(--panel)" stroke="var(--ember)" stroke-width="1.5"/>
            <text x="0" y="4" text-anchor="middle" class="warroom-label" style="fill:var(--ember);">C</text>
          </g>
        </svg>
        <div class="hero-visual-readout" style="left:auto;right:4%;bottom:auto;top:4%;">
          <span>Map overview</span>
        </div>
      </div>
    </div>
  </div>
</header>

<section class="container" style="padding-bottom:60px;">
  <!-- ---------- Tournament Bracket Section ---------- -->
  <div style="margin-bottom:48px;">
    <h3 style="font-size:1.1rem;margin-bottom:14px;">Tournament Bracket</h3>
    <div id="bracket-display"></div>
  </div>

  <div class="grid grid-2" style="align-items:start;margin-bottom:48px;">
    <div>
      <h3 style="font-size:1.1rem;margin-bottom:14px;">Upcoming</h3>
      <div id="upcoming-list" class="grid"></div>
    </div>
    <div class="card reveal" id="clan-stats-card">
      <span class="eyebrow">Clan stats</span>
      <h3 style="font-size:1.1rem;margin:8px 0 16px;">Season record</h3>
      <div id="clan-stats-body" style="font-family:var(--font-mono);font-size:0.85rem;color:var(--text-dim);">Loading…</div>
    </div>
  </div>

  <h3 style="font-size:1.1rem;margin-bottom:14px;">Results</h3>
  <div id="results-list" class="grid grid-2"></div>
</section>

<footer class="site-footer">
  <span>© 2026 Himawari Clan</span>
  <span>Managed via the clan admin panel</span>
</footer>

<script src="js/main.js"></script>
<script src="js/enhancements.js"></script>
<script>
(async () => {
  // ---------- Load Bracket Image ----------
  const bracketEl = document.getElementById('bracket-display');
  if (bracketEl) {
    let item = null;

    // 1. Try API first
    try {
      const res = await fetch('/api/bracket');
      if (res.ok) {
        const data = await res.json();
        item = Array.isArray(data) ? data[0] : data;
      }
    } catch (e) {
      // API not reachable
    }

    // 2. Fallback to localStorage if API unavailable or empty
    if (!item || !item.image_url) {
      const localBracket = localStorage.getItem('himawari_bracket');
      // Validate string before using
      if (localBracket && (localBracket.startsWith('data:image/') || localBracket.startsWith('http'))) {
        item = { image_url: localBracket, title: 'Tournament Bracket' };
      }
    }

    // Render Bracket
    if (item && item.image_url) {
      bracketEl.innerHTML = `
        <div class="card reveal" style="text-align:center;padding:20px;">
          ${item.title ? `<h3 style="font-family:var(--font-display);font-size:1.3rem;margin-bottom:16px;color:var(--gold);">${item.title}</h3>` : ''}
          <div style="overflow-x:auto;">
            <img src="${item.image_url}" alt="Tournament Bracket" style="max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line);" onerror="this.onerror=null; this.parentElement.parentElement.innerHTML='<p style=\\'color:var(--text-dim);font-family:var(--font-mono);font-size:0.85rem;\\'>Invalid or corrupted bracket image.</p>';">
          </div>
        </div>
      `;
      if (typeof initReveal === 'function') initReveal();
    } else {
      bracketEl.innerHTML = '<p style="color:var(--text-dim);font-family:var(--font-mono);font-size:0.85rem;">No bracket uploaded yet.</p>';
    }
  }

  // ---------- Load Matches ----------
  const upcomingEl = document.getElementById('upcoming-list');
  const resultsEl = document.getElementById('results-list');
  const statsBody = document.getElementById('clan-stats-body');
  let matches = [];

  // 1. Try API first
  try {
    if (typeof apiList === 'function') {
      matches = await apiList('matches');
    }
  } catch (e) {
    matches = [];
  }

  // 2. Fallback to localStorage (himawari_tournaments) if API unavailable or empty
  if (!matches || matches.length === 0) {
    const rawTournaments = localStorage.getItem('himawari_tournaments');
    if (rawTournaments) {
      try {
        const parsed = JSON.parse(rawTournaments);
        matches = parsed.map(t => ({
          opponent: t.name || t.opponent || 'Opponent',
          event: t.format || t.event || 'Tournament',
          event_date: t.date || t.event_date || new Date().toISOString(),
          status: (t.status && t.status.toLowerCase() === 'completed') ? 'result' : 'upcoming',
          score_for: t.score_for !== undefined ? Number(t.score_for) : 0,
          score_against: t.score_against !== undefined ? Number(t.score_against) : 0,
          vod_url: t.vod_url || null
        }));
      } catch (err) {
        console.error('Error parsing local tournaments:', err);
      }
    }
  }

  function countdown(dateStr) {
    const diff = new Date(dateStr) - new Date();
    if (isNaN(diff) || diff <= 0) return 'Today';
    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    return days > 0 ? `in ${days}d ${hours}h` : `in ${hours}h`;
  }

  function formatDate(dateStr) {
    const d = new Date(dateStr);
    return isNaN(d.getTime()) ? dateStr : d.toLocaleDateString(undefined, { dateStyle: 'medium' });
  }

  const upcoming = matches.filter(m => m.status === 'upcoming').sort((a,b) => new Date(a.event_date) - new Date(b.event_date));
  const results = matches.filter(m => m.status === 'result').sort((a,b) => new Date(b.event_date) - new Date(a.event_date));

  upcomingEl.innerHTML = upcoming.length ? upcoming.map(m => `
    <div class="card reveal">
      <span class="eyebrow">${formatDate(m.event_date)} · ${countdown(m.event_date)}</span>
      <h3 style="margin-top:8px;">vs ${m.opponent}</h3>
      <p style="color:var(--text-dim);font-family:var(--font-mono);font-size:0.8rem;">${m.event || 'Scrim'}</p>
    </div>
  `).join('') : '<p style="color:var(--text-dim);font-family:var(--font-mono);font-size:0.85rem;">Nothing scheduled yet.</p>';

  resultsEl.innerHTML = results.length ? results.map(m => {
    const won = m.score_for > m.score_against;
    return `
    <div class="card reveal" style="border-left:3px solid ${won ? '#7ee787' : '#ff6b6b'};">
      <span class="eyebrow" style="color:${won ? '#7ee787' : '#ff6b6b'};">${won ? 'WIN' : 'LOSS'} · ${formatDate(m.event_date)}</span>
      <h3 style="margin-top:8px;">vs ${m.opponent} — ${m.score_for}–${m.score_against}</h3>
      <p style="color:var(--text-dim);font-family:var(--font-mono);font-size:0.8rem;">${m.event || 'Scrim'}</p>
      ${m.vod_url ? `<a href="${m.vod_url}" target="_blank" rel="noopener" class="btn btn-ghost" style="margin-top:10px;">Watch VOD</a>` : ''}
    </div>
  `; }).join('') : '<p style="color:var(--text-dim);font-family:var(--font-mono);font-size:0.85rem;">No results logged yet.</p>';

  // ---------- Clan stats ----------
  if (results.length === 0) {
    statsBody.innerHTML = 'No results logged yet.';
  } else {
    const wins = results.filter(m => m.score_for > m.score_against).length;
    const losses = results.length - wins;
    const winRate = Math.round((wins / results.length) * 100);

    let streakCount = 0;
    let streakType = null;
    for (const m of results) {
      const w = m.score_for > m.score_against;
      if (streakType === null) { streakType = w; streakCount = 1; }
      else if (w === streakType) { streakCount++; }
      else break;
    }
    const streakLabel = streakCount > 0 ? `${streakType ? 'W' : 'L'}${streakCount}` : '—';

    statsBody.innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <div><div style="color:var(--gold);font-size:1.4rem;font-family:var(--font-display);font-style:italic;font-weight:700;">${results.length}</div><div style="font-size:0.68rem;letter-spacing:0.08em;text-transform:uppercase;">Total matches</div></div>
        <div><div style="color:var(--gold);font-size:1.4rem;font-family:var(--font-display);font-style:italic;font-weight:700;">${wins}–${losses}</div><div style="font-size:0.68rem;letter-spacing:0.08em;text-transform:uppercase;">Record</div></div>
        <div><div style="color:var(--gold);font-size:1.4rem;font-family:var(--font-display);font-style:italic;font-weight:700;">${winRate}%</div><div style="font-size:0.68rem;letter-spacing:0.08em;text-transform:uppercase;">Win rate</div></div>
        <div><div style="color:var(--gold);font-size:1.4rem;font-family:var(--font-display);font-style:italic;font-weight:700;">${streakLabel}</div><div style="font-size:0.68rem;letter-spacing:0.08em;text-transform:uppercase;">Current streak</div></div>
      </div>
    `;
  }
})();
</script>
</body>
</html>
